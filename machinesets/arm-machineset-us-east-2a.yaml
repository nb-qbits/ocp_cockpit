apiVersion: machine.openshift.io/v1beta1
kind: MachineSet
metadata:
  annotations:
    # These annotations tell the cluster autoscaler about this MachineSet's capacity
    capacity.cluster-autoscaler.kubernetes.io/labels: kubernetes.io/arch=arm64
    machine.openshift.io/GPU: "0"
    machine.openshift.io/memoryMb: "16384"
    machine.openshift.io/vCPU: "4"
  labels:
    machine.openshift.io/cluster-api-cluster: ocp-4brvm
  name: ocp-4brvm-worker-arm-us-east-2a
  namespace: openshift-machine-api
spec:
  replicas: 1
  selector:
    matchLabels:
      machine.openshift.io/cluster-api-cluster: ocp-4brvm
      machine.openshift.io/cluster-api-machineset: ocp-4brvm-worker-arm-us-east-2a
  template:
    metadata:
      labels:
        machine.openshift.io/cluster-api-cluster: ocp-4brvm
        machine.openshift.io/cluster-api-machine-role: worker
        machine.openshift.io/cluster-api-machine-type: worker
        machine.openshift.io/cluster-api-machineset: ocp-4brvm-worker-arm-us-east-2a
    spec:
      lifecycleHooks: {}
      metadata:
        labels:
          # This label ensures the node is identifiable as ARM
          node-role.kubernetes.io/worker: ""
      providerSpec:
        value:
          # ---------------------------------------------------------------
          # KEY CHANGE 1: ARM-specific RHCOS AMI
          # This is the aarch64 RHCOS image for us-east-2
          # Retrieved from: oc get configmap/coreos-bootimages ...
          # ---------------------------------------------------------------
          ami:
            id: ami-08066b4a2c0a88670
          apiVersion: machine.openshift.io/v1beta1
          blockDevices:
          - ebs:
              encrypted: true
              iops: 0
              kmsKey:
                arn: ""
              volumeSize: 120
              volumeType: gp3
          capacityReservationId: ""
          credentialsSecret:
            name: aws-cloud-credentials
          deviceIndex: 0
          iamInstanceProfile:
            id: ocp-4brvm-worker-profile
          # ---------------------------------------------------------------
          # KEY CHANGE 2: Graviton instance type
          # m6g = Graviton2 general purpose
          # xlarge = 4 vCPU, 16 GB RAM (sufficient for demo)
          # Other options: m7g.xlarge (Graviton3), c7g.xlarge (compute-optimized)
          # ---------------------------------------------------------------
          instanceType: m6g.xlarge
          kind: AWSMachineProviderConfig
          metadata:
            creationTimestamp: null
          metadataServiceOptions: {}
          placement:
            availabilityZone: us-east-2a
            region: us-east-2
          # Same security groups as existing workers
          securityGroups:
          - filters:
            - name: tag:Name
              values:
              - ocp-4brvm-node
          - filters:
            - name: tag:Name
              values:
              - ocp-4brvm-lb
          # Same subnet as us-east-2a workers
          subnet:
            filters:
            - name: tag:Name
              values:
              - ocp-4brvm-subnet-private-us-east-2a
          # Same tags as existing workers (cluster ownership + metadata)
          tags:
          - name: kubernetes.io/cluster/ocp-4brvm
            value: owned
          - name: Stack
            value: project openshift-cluster-hq4b7
          - name: config
            value: openshift-cluster
          - name: guid
            value: hq4b7
          - name: owner
            value: unknown
          - name: uuid
            value: 2024517e-7050-56d8-befb-0c2e4928afb7
          userDataSecret:
            name: worker-user-data
